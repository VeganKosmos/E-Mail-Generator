<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VeganMail-O-Mat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-4 px-3 sm:p-6 font-sans text-slate-800">

  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200">
    
    <!-- Kampagnen-Umschalter (wird automatisch ausgeblendet, wenn ?c= in der URL steht) -->
    <div id="campaign-switcher" class="bg-slate-900 text-white px-4 py-2 text-xs flex items-center justify-between gap-2">
      <span class="text-slate-400">Aktion:</span>
      <div class="flex gap-1.5" id="switcher-buttons"></div>
    </div>

    <div class="p-5 sm:p-6">
      <h1 id="camp-title" class="text-xl sm:text-2xl font-extrabold text-slate-900 leading-tight mb-1.5"></h1>
      <p id="camp-desc" class="text-slate-600 text-sm leading-relaxed mb-5"></p>

      <!-- SCHRITT 1: SUPERMARKT-SUCHE (Nur bei 'local') -->
      <div id="local-search-section" class="mb-5 bg-slate-50 p-3.5 rounded-xl border border-slate-200 hidden">
        <label class="block text-sm font-bold text-slate-800 mb-1.5">
          Wo kaufst du ein? (PLZ oder Ort)
        </label>
        <div class="flex gap-2 mb-2.5">
          <input type="text" id="zip-input" placeholder="z.B. 46240, 59846, Bochum..." 
                 onkeydown="if(event.key==='Enter') searchGermanyMarkets()"
                 class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          <button onclick="searchGermanyMarkets()" id="search-btn" 
                  class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shrink-0 transition">
            Suchen
          </button>
        </div>

        <!-- FORTSCHRITTS-ANZEIGE (PROGRESS BAR) -->
        <div id="progress-container" class="hidden mb-3 bg-white p-2.5 rounded-lg border border-slate-200">
          <div class="flex justify-between text-xs font-semibold text-slate-700 mb-1">
            <span id="progress-step-text">Starte Suche...</span>
            <span id="progress-percent">10%</span>
          </div>
          <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
            <div id="progress-bar" class="bg-emerald-600 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
          </div>
        </div>

        <!-- STATUS-HINWEIS -->
        <div id="search-status" class="text-xs mb-2.5 px-3 py-2 rounded-lg hidden"></div>

        <!-- DROPDOWN FÜR GEFUNDENE ECHTE MÄRKTE -->
        <div id="dropdown-wrapper">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Markt auswählen:</label>
          <select id="market-select" onchange="onMarketChange()" 
                  class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm bg-white font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-2">
          </select>

          <!-- HINWEIS-BANNER WENN MARKT SCHON AUF NOT-EGG.DE GELISTET IST -->
          <div id="already-listed-banner" class="hidden mb-2 p-3 rounded-xl bg-emerald-100 border border-emerald-300 text-emerald-950 text-xs leading-relaxed">
            🎉 <strong>Gute Nachricht:</strong>
