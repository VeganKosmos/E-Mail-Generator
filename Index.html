<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VeganVoice – Deine Stimme in 30 Sekunden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .fade-in { animation: fadeIn 0.25s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-4 px-3 sm:p-6 font-sans text-slate-800">

  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- Top-Leiste zum schnellen Testen / Wechseln der Kampagnen (Wird ausgeblendet, wenn URL-Parameter ?c=... gesetzt ist) -->
    <div id="campaign-switcher" class="bg-slate-900 text-white px-4 py-2.5 text-xs flex flex-wrap items-center justify-between gap-2">
      <span class="text-slate-400 font-medium">Aktive Kampagne wählen:</span>
      <div class="flex gap-1.5" id="switcher-buttons"></div>
    </div>

    <div class="p-5 sm:p-7">
      <!-- Kampagnen-Kopf -->
      <div class="inline-block px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-100 text-emerald-800 mb-2" id="camp-badge">Aktion</div>
      <h1 id="camp-title" class="text-2xl font-extrabold text-slate-900 leading-tight mb-2"></h1>
      <p id="camp-desc" class="text-slate-600 text-sm leading-relaxed mb-6"></p>

      <!-- ================================================================= -->
      <!-- MODUS 'LOCAL': DEUTSCHLANDWEITE REWE / EDEKA SUCHE                -->
      <!-- ================================================================= -->
      <div id="local-search-section" class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 hidden">
        <label class="block text-sm font-bold text-slate-800 mb-1.5">
          1. Wo kaufst du ein? (PLZ oder Ort in Deutschland)
        </label>
        <div class="flex gap-2 mb-3">
          <input type="text" id="zip-input" placeholder="z.B. 40667, Berlin, 28195..." 
                 onkeydown="if(event.key==='Enter') searchGermanyMarkets()"
                 class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          <button onclick="searchGermanyMarkets()" id="search-btn" 
                  class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white px-4 py-2.5 rounded-xl text-sm font-bold shrink-0 transition shadow-sm">
            🔍 Suchen
          </button>
        </div>

        <div id="search-status" class="text-xs text-slate-500 mb-2 hidden"></div>

        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Gefundene Märkte auswählen:</label>
        <select id="market-select" onchange="onMarketChange()" 
                class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm bg-white font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </select>
        <div id="routing-badge" class="mt-2 text-xs px-2.5 py-1.5 rounded-lg bg-slate-200/70 text-slate-600 leading-snug"></div>
      </div>

      <!-- ================================================================= -->
      <!-- SCHRITT 2: THEMEN- / SCHWERPUNKT-WAHL (2+ Themen pro Kampagne)    -->
      <!-- ================================================================= -->
      <div id="topic-section" class="mb-6">
        <label class="block text-sm font-bold text-slate-800 mb-2" id="topic-label">
          Welcher Punkt ist dir besonders wichtig?
        </label>
        <div id="topic-buttons" class="grid grid-cols-1 gap-2">
          <!-- Wird dynamisch aus den Topics der Kampagne gefüllt -->
        </div>
      </div>

      <!-- ================================================================= -->
      <!-- SCHRITT 3: ABSENDER-NAME                                          -->
      <!-- ================================================================= -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-slate-800 mb-1.5">
          Dein Name (für die Unterschrift unter der E-Mail)
        </label>
        <input type="text" id="user-name" placeholder="Vor- und Nachname eingeben..." 
               oninput="renderEmail()" 
               class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>

      <!-- ================================================================= -->
      <!-- SCHRITT 4: E-MAIL VORSCHAU & BAUSTEIN-MIXER                       -->
      <!-- ================================================================= -->
      <div class="mb-6">
        <div class="flex justify-between items-center mb-2">
          <label class="text-sm font-bold text-slate-800">Deine fertige E-Mail (frei anpassbar)</label>
          <button onclick="rollNewCombination()" 
                  class="text-xs bg-emerald-50 hover:bg-emerald-100 active:bg-emerald-200 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 transition shadow-sm">
            🎲 Neu kombinieren
          </button>
        </div>

        <!-- Empfänger & Betreff Box -->
        <div class="bg-slate-50 border border-slate-200 rounded-t-xl p-3 border-b-0 space-y-1.5">
          <div class="flex items-center justify-between text-xs">
            <span class="text-slate-500 font-medium">An: <strong id="preview-to" class="font-mono text-slate-800"></strong></span>
            <span id="preview-cc-wrap" class="text-slate-400 font-mono hidden">CC: <span id="preview-cc"></span></span>
          </div>
          <div class="pt-1 border-t border-slate-200/80">
            <span class="text-[11px] uppercase tracking-wider text-slate-400 font-bold block">Betreff (bearbeitbar):</span>
            <input type="text" id="preview-subject" 
                   oninput="updateMailtoLink()"
                   class="w-full bg-transparent font-bold text-sm text-slate-900 focus:outline-none mt-0.5">
          </div>
        </div>

        <!-- E-Mail Textkörper -->
        <textarea id="preview-body" rows="10" 
                  oninput="updateMailtoLink()"
                  class="w-full border border-slate-300 rounded-b-xl p-3.5 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-emerald-500 font-sans"></textarea>
        <p class="text-[11px] text-slate-400 mt-1 text-right">
          4 Bausteine aktiv • Jede Kombination ergibt einen individuellen Text
        </p>
      </div>

      <!-- ================================================================= -->
      <!-- SCHRITT 5: 1-KLICK ABSENDEN & EINZEL-KOPIER-BUTTONS               -->
      <!-- ================================================================= -->
      <div class="space-y-3">
        <!-- Echter <a>-Tag verhindert Blockieren durch In-App-Browser (Instagram etc.) -->
        <a id="mailto-btn" href="#" 
           class="block w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-md text-center text-base transition">
          ✉️ Jetzt in E-Mail-App öffnen & senden
        </a>

        <!-- Webmail / Manuelles Kopieren für Nutzer ohne eingerichtete Mail-App -->
        <div class="pt-2">
          <p class="text-xs text-center text-slate-500 mb-2 font-medium">
            Öffnet sich deine Mail-App nicht? Direkt kopieren oder Gmail nutzen:
          </p>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
            <button onclick="copyPart('to', this)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-2.5 rounded-lg border border-slate-200 transition">
              📋 Empfänger
            </button>
            <button onclick="copyPart('subject', this)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-2.5 rounded-lg border border-slate-200 transition">
              📋 Betreff
            </button>
            <button onclick="copyPart('body', this)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-2.5 rounded-lg border border-slate-200 transition">
              📋 E-Mail-Text
            </button>
            <a id="gmail-btn" href="#" target="_blank" rel="noopener" 
               class="bg-red-50 hover:bg-red-100 text-red-700 font-semibold py-2 px-2.5 rounded-lg border border-red-200 text-center transition">
              🌐 In Gmail öffnen
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>

    // Automatische Zuordnung der 7 EDEKA-Regionalgesellschaften anhand der ersten 2 PLZ-Ziffern
    function getEdekaRegionalEmail(zipStr) {
      const prefix = parseInt((zipStr || "").substring(0, 2), 10);
      if (isNaN(prefix)) return "info@edeka.de";
      if ((prefix >= 20 && prefix <= 25) || prefix === 18 || prefix === 19) return "kundenservice.nord@edeka.de";
      if ((prefix >= 1 && prefix <= 17) || (prefix >= 26 && prefix <= 33) || prefix === 38 || prefix === 39) return "kundenservice@minden.edeka.de";
      if (prefix >= 40 && prefix <= 59) return "kundenservice.nordwest@edeka.de"; // EDEKA Rhein-Ruhr / Nordwest
      if (prefix >= 34 && prefix <= 37) return "kundenservice@edeka-hessenring.de";
      if (prefix >= 60 && prefix <= 79) return "kundenservice@edeka-suedwest.de";
      if (prefix >= 90 && prefix <= 99) return "kundenservice.nbst@edeka.de";
      if (prefix >= 80 && prefix <= 89) return "kundenservice.suedbayern@edeka.de";
      return "info@edeka.de";
    }
